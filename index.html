<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Coisudo</title>
<link rel="icon" type="image/png" href="https://github.com/user-attachments/assets/70800093-fbb7-4fe3-b0b6-ec9c6c8c8500">
<style>
  :root{
    --bg: #0f0a1a;
    --bg-soft: #17101f;
    --card: #1c1426;
    --card-hover: #2a1c3a;
    --purple: #9d4edd;
    --purple-deep: #5a189a;
    --purple-glow: rgba(157, 78, 221, 0.35);
    --text: #f1ecf7;
    --text-dim: #9b8fae;
    --border: #2e2240;

    --online: #3ddc84;
    --online-glow: rgba(61, 220, 132, 0.35);
    --manutencao: #f5b942;
    --manutencao-glow: rgba(245, 185, 66, 0.35);
    --offline: #e5484d;
    --offline-glow: rgba(229, 72, 77, 0.35);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior: smooth; }

  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, var(--purple-glow), transparent 35%),
      radial-gradient(circle at 85% 90%, rgba(90,24,154,0.25), transparent 40%);
    background-size: 200% 200%;
    animation: bgShift 18s ease-in-out infinite;
    color: var(--text);
    font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    padding: 48px 24px 64px;
  }

  @keyframes bgShift{
    0%{ background-position: 0% 0%, 100% 100%; }
    50%{ background-position: 40% 30%, 60% 70%; }
    100%{ background-position: 0% 0%, 100% 100%; }
  }

  @media (prefers-reduced-motion: reduce){ body{ animation: none; } }

  header{ max-width: 900px; margin: 0 auto 36px; text-align: center; }

  .eyebrow{
    display:inline-block;
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--purple);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 16px;
    margin-bottom: 18px;
    background: rgba(157,78,221,0.08);
  }

  h1{
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
  }
  h1 span{ color: var(--purple); }

  header p{ color: var(--text-dim); font-size: 1rem; max-width: 480px; margin: 0 auto; }

  /* ===== Busca ===== */
  .search-wrap{
    max-width: 480px;
    margin: 28px auto 0;
    position: relative;
  }

  .search-wrap svg{
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    stroke: var(--text-dim);
    pointer-events: none;
  }

  #searchInput{
    width: 100%;
    padding: 13px 16px 13px 44px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }

  #searchInput::placeholder{ color: var(--text-dim); }

  #searchInput:focus{
    border-color: var(--purple);
    box-shadow: 0 0 0 3px var(--purple-glow);
  }

  main{ max-width: 1000px; margin: 40px auto 0; }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }

  .empty-state{
    text-align: center;
    color: var(--text-dim);
    padding: 48px 16px;
    display: none;
  }

  .card{
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
  }

  .card:hover, .card:focus-visible{
    transform: translateY(-4px);
    border-color: var(--purple);
    background: var(--card-hover);
    box-shadow: 0 12px 28px -10px var(--purple-glow);
  }

  .card:focus-visible{ outline: 2px solid var(--purple); outline-offset: 2px; }

  .card-media{
    width: 100%;
    aspect-ratio: 16/10;
    overflow: hidden;
    background: var(--bg-soft);
    position: relative;
  }

  .card-media img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }

  .card:hover .card-media img{ transform: scale(1.05); }

  /* ===== Selo de status ===== */
  .status-pill{
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px 5px 8px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    backdrop-filter: blur(6px);
    background: rgba(15, 10, 26, 0.65);
    border: 1px solid rgba(255,255,255,0.08);
  }

  .status-dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .status-pill[data-status="online"]{ color: var(--online); }
  .status-pill[data-status="online"] .status-dot{
    background: var(--online);
    box-shadow: 0 0 8px var(--online-glow);
  }

  .status-pill[data-status="manutencao"]{ color: var(--manutencao); }
  .status-pill[data-status="manutencao"] .status-dot{
    background: var(--manutencao);
    box-shadow: 0 0 8px var(--manutencao-glow);
    animation: pulse 1.4s ease-in-out infinite;
  }

  .status-pill[data-status="offline"]{ color: var(--offline); }
  .status-pill[data-status="offline"] .status-dot{
    background: var(--offline);
    box-shadow: 0 0 8px var(--offline-glow);
  }

  .status-pill[data-status="em_breve"]{ color: var(--purple); }
  .status-pill[data-status="em_breve"] .status-dot{
    background: var(--purple);
    box-shadow: 0 0 8px var(--purple-glow);
  }

  @keyframes pulse{
    0%, 100%{ opacity: 1; transform: scale(1); }
    50%{ opacity: 0.5; transform: scale(1.3); }
  }

  /* ===== Card "em breve" (placeholder, não clicável) ===== */
  .card.em-breve{
    cursor: default;
    border-style: dashed;
    opacity: 0.6;
  }

  .card.em-breve:hover{
    transform: none;
    background: var(--card);
    box-shadow: none;
    border-color: var(--purple);
  }

  .card.em-breve .card-media{
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card.em-breve .card-media svg{
    width: 32px;
    height: 32px;
    stroke: var(--text-dim);
  }

  .card.em-breve .card-accent{ opacity: 0.15 !important; }

  /* ===== Countdown ===== */
  .countdown-wrap{
    max-width: 480px;
    margin: 24px auto 0;
    padding: 18px 20px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--card);
    text-align: center;
    display: none; /* aparece via JS quando há uma data válida no futuro */
  }

  .countdown-label{
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  .countdown-grid{
    display: flex;
    justify-content: center;
    gap: 14px;
  }

  .countdown-unit{
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 52px;
  }

  .countdown-value{
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--purple);
    font-variant-numeric: tabular-nums;
  }

  .countdown-unit-label{
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .countdown-ended{
    color: var(--online);
    font-weight: 600;
    font-size: 0.95rem;
  }

  .card-body{ padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card-title{ font-size: 1rem; font-weight: 600; line-height: 1.3; }
  .card-desc{ font-size: 0.85rem; color: var(--text-dim); line-height: 1.4; }

  .card-accent{
    height: 3px;
    width: 100%;
    background: linear-gradient(90deg, var(--purple-deep), var(--purple));
    opacity: 0.4;
    transition: opacity 0.18s ease;
  }
  .card:hover .card-accent{ opacity: 1; }

  footer{
    text-align: center;
    margin-top: 56px;
    color: var(--text-dim);
    font-size: 0.8rem;
    transition: color 0.25s ease;
    cursor: default;
  }
  footer:hover{ color: #c77dff; }

  @media (prefers-reduced-motion: reduce){
    .card, .card-media img, .status-dot{ transition: none; animation: none; }
  }

    /* ===== Selo de administrador ===== */
  .admin-badge{
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 18px 8px 8px;
    z-index: 10;
    box-shadow: 0 8px 20px -8px rgba(0,0,0,0.5);
  }

  .admin-badge img{
    width: 38px;
    height: 38px;
    border-radius: 12px;
    object-fit: cover;
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--purple), 0 0 16px var(--purple-glow);
  }

  .admin-badge-text{
    display: flex;
    flex-direction: column;
    line-height: 1.25;
  }

  .admin-badge-name{
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text);
  }

  .admin-badge-role{
    font-size: 0.65rem;
    color: var(--purple);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }

  @media (max-width: 520px){
    .admin-badge-text{ display: none; }
  }
</style>
</head>
<body>

    <div class="admin-badge">
    <img src="src/pfp.png" alt="Coiso">
    <div class="admin-badge-text">
      <span class="admin-badge-name">Coiso</span>
      <span class="admin-badge-role">Admin</span>
    </div>
  </div>

  <header>
    <span class="eyebrow">expantas forever s2</span>
    <h1>Organizado By <span>Coiso</span></h1>
    <p>"Resenhudo passou por aqui " - resenhudo</p>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Buscar plataforma..." autocomplete="off">
    </div>

    <div class="countdown-wrap" id="countdownWrap">
      <div class="countdown-label" id="countdownLabel">Contagem regressiva</div>
      <div class="countdown-grid" id="countdownGrid"></div>
    </div>
  </header>

  <main>
    <div class="grid" id="cardGrid"></div>
    <p class="empty-state" id="emptyState">Nenhuma plataforma encontrada.</p>
  </main>

  <footer>
    Painel organizado por -Coiso Coisudo de Souza.
  </footer>

<script>
  // ===========================================
  // ADICIONE OU EDITE OS LINKS AQUI
  // status: "online" | "manutencao" | "offline"
  // Isso é definido manualmente por você — sites de
  // governo bloqueiam checagem automática de status
  // pelo navegador (CORS), então não dá pra checar
  // isso sozinho de forma confiável. Atualize aqui
  // quando notar que algo caiu na sua região.
  // ===========================================
  const links = [
    {
      titulo: "Zunder",
      descricao: "Hacks de LeiaSP, Expansão, PreparaSP, Alura e mais (PRECISA DO DISCORD)",
      imagem: "https://zunder.lat/images/zunder-lockup.png",
      link: "https://platformdestroyer.fun/",
      status: "online"
    },
    {
      titulo: "OpenFuture",
      descricao: "Hacks de Speak, Khan academy, MicroBIT e Tarefa.",
      imagem: "https://openfuture.lol/icon.png",
      link: "https://openfuture.lol/",
      status: "online"
    },
    {
      titulo: "Apostilas",
      descricao: "Feito por Neji e seus amiguinhos, todas as apostilas sem excessão",
      imagem: "https://openfuture.lol/icon.png",
      link: "https://apostilas.nejizzuki.xyz/",
      status: "online"
    },
    {
      titulo: "Salve Estudante (NOVO) ",
      descricao: "Tarefa, redação e LeiaSP",
      imagem: "DtDf9ad6.webp",
      link: "https://salvaestudante.com/login",
      status: "online"
    },
    {
      titulo: "Nova plataforma",
      descricao: "Ainda sem previsão — fique de olho.",
      status: "em_breve"
    },
    // Exemplo de placeholder — apague o "titulo"/"descricao" e troque
    // pelo nome real quando a plataforma nova for anunciada. Para
    // ativar, basta trocar status para "online" e preencher link/imagem.
    {
      titulo: "Nova plataforma",
      descricao: "Ainda sem previsão — fique de olho.",
      status: "em_breve"
    }
  ];

  const grid = document.getElementById('cardGrid');
  const emptyState = document.getElementById('emptyState');
  const searchInput = document.getElementById('searchInput');

  const statusLabel = {
    online: "Online",
    manutencao: "Manutenção",
    offline: "Fora do ar",
    em_breve: "Em breve"
  };

  const clockIcon = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"></circle>
      <polyline points="12 7 12 12 15.5 14"></polyline>
    </svg>`;

  function renderCards(items){
    grid.innerHTML = "";
    items.forEach(item => {
      const status = item.status || "online";
      const isEmBreve = status === "em_breve";

      // Card "em breve" não tem link nem imagem real: vira um
      // placeholder visual, não um <a> clicável.
      const el = document.createElement(isEmBreve ? 'div' : 'a');
      el.className = isEmBreve ? 'card em-breve' : 'card';
      if (!isEmBreve){
        el.href = item.link;
        el.target = "_blank";
        el.rel = "noopener noreferrer";
      }

      const mediaContent = isEmBreve
        ? clockIcon
        : `<img src="${item.imagem}" alt="${item.titulo}" loading="lazy">`;

      el.innerHTML = `
        <div class="card-media">
          ${mediaContent}
          <span class="status-pill" data-status="${status}">
            <span class="status-dot"></span>${statusLabel[status] || "Online"}
          </span>
        </div>
        <div class="card-body">
          <div class="card-title">${item.titulo}</div>
          <div class="card-desc">${item.descricao}</div>
        </div>
        <div class="card-accent"></div>
      `;

      grid.appendChild(el);
    });

    emptyState.style.display = items.length ? "none" : "block";
  }

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = links.filter(item =>
      item.titulo.toLowerCase().includes(q) ||
      item.descricao.toLowerCase().includes(q)
    );
    renderCards(filtered);
  });

  renderCards(links);

 // ===========================================
  // COUNTDOWN DE DIAS LETIVOS — calendário Seduc-SP / PEI 2026
  //
  // FERIAS_DATE = último dia letivo antes do recesso.
  // Edite se o calendário oficial mudar (ex: em anos seguintes).
  //
  // FERIADOS_NAO_LETIVOS = datas (seg-sex) sem aula dentro do
  // período. Sábado e domingo já são descontados automaticamente.
  // ===========================================
  const COUNTDOWN_LABEL = "Dias letivos até as férias (desemprego dos 3º 😭)";
  const FERIAS_DATE = new Date(2026, 11, 18); // 18/12/2026 (mês 0-indexado)
  const FERIADOS_NAO_LETIVOS = [
    "2026-09-07", // Independência do Brasil
    "2026-10-12", // Nossa Senhora Aparecida
    "2026-11-02", // Finados
    "2026-11-20", // Consciência Negra
    // "2026-10-15", // Dia do Professor — descomente se não tiver aula na sua escola
  ];

  function contarDiasLetivos(dataInicio, dataFim, feriados){
    const feriadosSet = new Set(feriados);
    let contador = 0;
    const atual = new Date(dataInicio);
    atual.setHours(0, 0, 0, 0);
    const fim = new Date(dataFim);
    fim.setHours(0, 0, 0, 0);

    while (atual <= fim){
      const diaSemana = atual.getDay(); // 0 = domingo, 6 = sábado
      const isoDate = atual.toISOString().split('T')[0];

      if (diaSemana !== 0 && diaSemana !== 6 && !feriadosSet.has(isoDate)){
        contador++;
      }
      atual.setDate(atual.getDate() + 1);
    }
    return contador;
  }

  function startCountdownLetivo(targetDate, label, feriados){
    const wrap = document.getElementById('countdownWrap');
    const labelEl = document.getElementById('countdownLabel');
    const gridEl = document.getElementById('countdownGrid');

    labelEl.textContent = label || "Contagem regressiva";
    wrap.style.display = "block";

    function tick(){
      const hoje = new Date();
      const restantes = contarDiasLetivos(hoje, targetDate, feriados);

      if (restantes <= 0){
        gridEl.innerHTML = `<span class="countdown-ended">Muito obrigado por acompanhar o desenvolvimento desse site, Adeus.</span>`;
        clearInterval(timer);
        return;
      }

      gridEl.innerHTML = `
        <div class="countdown-unit">
          <span class="countdown-value">${restantes}</span>
          <span class="countdown-unit-label">${restantes === 1 ? 'dia letivo' : 'dias letivos'}</span>
        </div>`;
    }

    tick();
    // Recalcula a cada minuto — não precisa de mais frequência já que a unidade é "dia"
    const timer = setInterval(tick, 60000);
  }

  startCountdownLetivo(FERIAS_DATE, COUNTDOWN_LABEL, FERIADOS_NAO_LETIVOS);
</script>

</body>
</html>
